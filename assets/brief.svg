<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" width="816" height="1056">
  <style>@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Space+Mono&amp;display=swap');</style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#001E38"/><stop offset="1" stop-color="#00111E"/></linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#0E3A63" stroke-width="1" opacity="0.22"/></pattern>
    <filter id="g" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="5"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="816" height="1056" fill="url(#bg)"/>
  <rect width="816" height="1056" fill="url(#grid)"/>
  <rect x="28" y="28" width="760" height="1000" fill="none" stroke="#0E3A63" stroke-width="1.5"/>
  <path d="M28 52V28H52" fill="none" stroke="#0A70FC" stroke-width="3"/><path d="M788 52V28H764" fill="none" stroke="#0A70FC" stroke-width="3"/><path d="M28 1004V1028H52" fill="none" stroke="#0A70FC" stroke-width="3"/><path d="M788 1004V1028H764" fill="none" stroke="#0A70FC" stroke-width="3"/>
  <g transform="translate(54.00 64.00) scale(1.5)" fill="none" stroke="#0A70FC" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="8" r="2.7"/><path d="M16 10.7V25"/><path d="M9.4 16.7a6.6 6.6 0 0 0 13.2 0"/><path d="M10.8 14.2H21.2"/></g><g transform="translate(54.00 64.00) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="8" r="2.7"/><path d="M16 10.7V25"/><path d="M9.4 16.7a6.6 6.6 0 0 0 13.2 0"/><path d="M10.8 14.2H21.2"/></g><text x="104" y="84" font-family="'Space Mono','Courier New',monospace" font-size="20" fill="#FFFFFF" letter-spacing="5">ULYSSES</text><text x="105" y="104" font-family="'Space Mono','Courier New',monospace" font-size="11" fill="#80B8F8" letter-spacing="3" opacity="0.8">ENDURING ODYSSEY WATCH</text><text x="752" y="92" text-anchor="end" font-family="'Space Mono','Courier New',monospace" font-size="13" fill="#049FF3" letter-spacing="3">CREATIVE DIRECTION BRIEF</text><line x1="64" y1="128" x2="752" y2="128" stroke="#0E3A63" stroke-width="1.5"/><text x="62" y="222" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="500" font-size="62" fill="#FFFFFF" letter-spacing="-2">we steward the blue</text><text x="64" y="262" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="400" font-size="18" fill="#9DB2C6">A first day creative direction for Ulysses, by David T Phung.</text><text x="64" y="312" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#C6D4E2">Ulysses already owns the rarest thing a brand can have. Restraint. The homepage is one line of</text><text x="64" y="338" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#C6D4E2">serif over moving water, and the work does the talking. The task is not to add more. It is to grow</text><text x="64" y="364" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15" fill="#C6D4E2">the depth while keeping the silence, and to make every surface feel as engineered as the vehicles.</text><text x="64" y="430" font-family="'Space Mono','Courier New',monospace" font-size="13" fill="#049FF3" letter-spacing="3">FIVE PRINCIPLES THAT GUIDE THE WORK</text><line x1="64" y1="446" x2="752" y2="446" stroke="#0E3A63" stroke-width="1"/><text x="64" y="486" font-family="'Space Mono','Courier New',monospace" font-size="14" fill="#0A70FC">01</text><text x="98" y="486" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#fff" font-weight="600">One live signal.</text><text x="98" y="508" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#C6D4E2">Electric blue is telemetry, not decoration. Reserve it for what is genuinely live.</text><text x="64" y="544" font-family="'Space Mono','Courier New',monospace" font-size="14" fill="#0A70FC">02</text><text x="98" y="544" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#fff" font-weight="600">The ocean at night.</text><text x="98" y="566" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#C6D4E2">Deep navy is the canvas, and light arrives only where the work is.</text><text x="64" y="602" font-family="'Space Mono','Courier New',monospace" font-size="14" fill="#0A70FC">03</text><text x="98" y="602" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#fff" font-weight="600">Lowercase for the creed, mono for the proof.</text><text x="98" y="624" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#C6D4E2">Human lines, measured numbers, one clear hierarchy.</text><text x="64" y="660" font-family="'Space Mono','Courier New',monospace" font-size="14" fill="#0A70FC">04</text><text x="98" y="660" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#fff" font-weight="600">Sell the system, not the boat.</text><text x="98" y="682" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#C6D4E2">Mako, Kraken, and Leviathan are one fleet, never three products.</text><text x="64" y="718" font-family="'Space Mono','Courier New',monospace" font-size="14" fill="#0A70FC">05</text><text x="98" y="718" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="15.5" fill="#fff" font-weight="600">Proof at depth.</text><text x="98" y="740" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14.5" fill="#C6D4E2">72 hours, 5000 feet, 200 pounds, named plainly. The capability is the flex.</text><text x="64" y="782" font-family="'Space Mono','Courier New',monospace" font-size="13" fill="#049FF3" letter-spacing="3">THE FLEET</text><line x1="64" y1="798" x2="752" y2="798" stroke="#0E3A63" stroke-width="1"/><text x="64" y="836" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="22" fill="#fff">Mako</text><text x="64" y="860" font-family="'Space Mono','Courier New',monospace" font-size="12" fill="#80B8F8">AUV · 72h · 5,000 ft</text><text x="293.33333333333337" y="836" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="22" fill="#fff">Kraken</text><text x="293.33333333333337" y="860" font-family="'Space Mono','Courier New',monospace" font-size="12" fill="#80B8F8">launch · recover · recharge</text><text x="522.6666666666667" y="836" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="600" font-size="22" fill="#fff">Leviathan</text><text x="522.6666666666667" y="860" font-family="'Space Mono','Courier New',monospace" font-size="12" fill="#80B8F8">heavy class · 2026</text><circle cx="748" cy="828" r="5" fill="#0A70FC" filter="url(#g)"/><line x1="64" y1="960" x2="752" y2="960" stroke="#0E3A63" stroke-width="1.5"/><text x="64" y="992" font-family="'Space Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif" font-size="14" fill="#fff">davidtphung@nlt143.energy</text><text x="752" y="992" text-anchor="end" font-family="'Space Mono','Courier New',monospace" font-size="13" fill="#80B8F8">x.com/davidtphung</text><text x="64" y="1016" font-family="'Space Mono','Courier New',monospace" font-size="12" fill="#9DB2C6" opacity="0.85">davidtphung.github.io/ulysses-odyssey</text><text x="752" y="1016" text-anchor="end" font-family="'Space Mono','Courier New',monospace" font-size="12" fill="#9DB2C6" opacity="0.7" letter-spacing="3">ONE VEHICLE · INFINITE POSSIBILITIES</text>
</svg>
