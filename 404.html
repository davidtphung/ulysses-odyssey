<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Off the charts · Ulysses</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#001E38" />
  <link rel="icon" type="image/svg+xml" href="/ulysses-odyssey/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100svh; display: grid; place-items: center; text-align: center; padding: 2rem;
      background:
        radial-gradient(120% 90% at 50% -8%, #062a4d 0%, #001E38 44%, #00121F 100%) fixed;
      color: #9DB2C6; font-family: Inter, system-ui, -apple-system, sans-serif;
    }
    .grid { position: fixed; inset: 0; z-index: -1; opacity: .5;
      background-image: linear-gradient(rgba(14,58,99,.5) 1px, transparent 1px), linear-gradient(90deg, rgba(14,58,99,.5) 1px, transparent 1px);
      background-size: 64px 64px;
      -webkit-mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 75%);
      mask-image: radial-gradient(120% 80% at 50% 0%, #000 30%, transparent 75%); }
    .anchor { width: 56px; height: 56px; margin: 0 auto 1.75rem; display: grid; place-items: center;
      border-radius: 14px; background: #04284A; box-shadow: inset 0 0 0 1px rgba(14,58,99,.9); }
    .code { font-family: "Space Mono", monospace; letter-spacing: .35em; font-size: .72rem; color: #5ca0f5; text-transform: uppercase; }
    h1 { font-family: "Space Grotesk", system-ui, sans-serif; font-weight: 500; color: #fff;
      font-size: clamp(2.6rem, 9vw, 5rem); line-height: 1; letter-spacing: -.03em; margin: 1rem 0 .25rem; }
    p { max-width: 30rem; margin: 1rem auto 0; line-height: 1.6; }
    .signal { display:inline-block; width:7px; height:7px; border-radius:99px; background:#0A70FC; box-shadow:0 0 12px 2px rgba(10,112,252,.85); vertical-align: middle; margin-right:.5rem; }
    a.btn { display: inline-flex; align-items: center; gap: .5rem; margin-top: 2rem; text-decoration: none;
      background: #0A70FC; color: #fff; font-weight: 600; padding: .85rem 1.6rem; border-radius: 999px;
      box-shadow: 0 10px 30px -10px rgba(10,112,252,.7); transition: transform .3s, box-shadow .3s; }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 16px 40px -10px rgba(10,112,252,.9); }
    :focus-visible { outline: 2px solid #049FF3; outline-offset: 3px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="grid"></div>
  <main>
    <div class="anchor">
      <svg viewBox="0 0 32 32" width="30" height="30" fill="none" stroke="#0A70FC" stroke-width="2" stroke-linecap="round"><circle cx="16" cy="8" r="2.4"/><path d="M16 10.5V25M9 16.5a7 7 0 0 0 14 0M10.5 14H21.5"/></svg>
    </div>
    <p class="code"><span class="signal"></span>404 · no signal</p>
    <h1>off the charts</h1>
    <p>This heading runs past the edge of the map. The watch holds, but there is nothing to plot here.</p>
    <a class="btn" href="/ulysses-odyssey/">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 5l-6 6 6 6M5 11h14"/></svg>
      Back to the bridge
    </a>
  </main>
</body>
</html>
